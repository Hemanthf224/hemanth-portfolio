<title>Hemanth Reddy — Striker Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">

<style>
/* ══ TWO INKS ONLY: paper and ink ═══════════════════════════════════════ */
:root{
  /* ══ EGO MODE (Light Theme) ══ */
  --paper:#FFFFFF; --paper-2:#F5F5F5; --ink:#0B0B0C; --ink-soft:#3A3A3D; --ink-faint:#7C7C81;
  --rule:#E63946; --tone:#E63946; --tone-op:.15; --shadow:6px 6px 0 var(--rule);
  --vid-op:.24; --vid-blend:multiply; --dot-blend:multiply;
}
@media (prefers-color-scheme: dark){
  :root:not([data-mode="paper"]){
    --paper:#040914; --paper-2:#081326; --ink:#E6F1FF; --ink-soft:#8892B0; --ink-faint:#495670;
    --rule:#00E5FF; --tone:#00E5FF; --tone-op:.25; --shadow:6px 6px 0 var(--rule);
    --vid-op:.20; --vid-blend:screen; --dot-blend:screen;
  }
}
:root[data-mode="ink"]{
  --paper:#040914; --paper-2:#081326; --ink:#E6F1FF; --ink-soft:#8892B0; --ink-faint:#495670;
  --rule:#00E5FF; --tone:#00E5FF; --tone-op:.25; --shadow:6px 6px 0 var(--rule);
  --vid-op:.20; --vid-blend:screen; --dot-blend:screen;
}

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Zen Kaku Gothic New",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.7;overflow-x:hidden;transition:background .35s,color .35s}
h1,h2,h3{font-family:"Anton",Impact,"Haettenschweiler",sans-serif;font-weight:400;margin:0;
  line-height:.92;text-transform:uppercase;letter-spacing:.004em;text-wrap:balance}
a{color:inherit}
::selection{background:var(--ink);color:var(--paper)}
.wrap{max-width:1180px;margin:0 auto;padding:0 26px}
.lbl{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.2em;font-size:11px;color:var(--ink-faint)}
.jp{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:500;letter-spacing:.18em;font-size:12px;
  color:var(--ink-faint)}
.num{font-variant-numeric:tabular-nums}
.inv{background:var(--ink);color:var(--paper);padding:2px 9px;display:inline-block}
.tone{background-image:radial-gradient(var(--tone) 1.05px, transparent 1.15px);
  background-size:5px 5px;opacity:var(--tone-op)}

/* ══ PLATE ══════════════════════════════════════════════════════════════ */
.plate{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#lines{position:absolute;inset:0;width:100%;height:100%;opacity:.5}
.reel{position:absolute;inset:-8% -8% -8% 38%;transform-origin:center;
  -webkit-mask-image:radial-gradient(66% 74% at 66% 46%,#000 28%,transparent 78%);
  mask-image:radial-gradient(66% 74% at 66% 46%,#000 28%,transparent 78%)}
.reel video{width:100%;height:100%;object-fit:cover;display:block;
  filter:grayscale(1) contrast(1.75) brightness(.78);opacity:var(--vid-op);
  mix-blend-mode:var(--vid-blend)}
/* the clip is printed, not played: halftone dots and press lines sit over it */
.reel .dots{position:absolute;inset:0;mix-blend-mode:var(--dot-blend);opacity:.5;
  background-image:radial-gradient(var(--tone) 1.15px, transparent 1.25px);background-size:5px 5px}
.reel .press{position:absolute;inset:0;opacity:.28;
  background:repeating-linear-gradient(180deg,transparent 0 2px,var(--paper) 2px 3px)}
.reel .edge{position:absolute;inset:0;box-shadow:inset 0 0 120px 40px var(--paper)}
.plate .fade{position:absolute;inset:0;background:
  radial-gradient(72% 58% at 12% 38%, var(--paper) 0%, transparent 72%),
  linear-gradient(90deg, var(--paper) 6%, color-mix(in srgb,var(--paper) 82%,transparent) 42%, color-mix(in srgb,var(--paper) 30%,transparent) 72%, transparent 100%)}
#root{position:relative;z-index:2}
section,footer{background:linear-gradient(90deg,
  color-mix(in srgb,var(--paper) 95%,transparent) 50%,
  color-mix(in srgb,var(--paper) 70%,transparent) 100%)}

/* ══ bar ════════════════════════════════════════════════════════════════ */
header.bar{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:50;background:var(--paper);border:3px solid var(--rule);box-shadow:var(--shadow);width:calc(100% - 32px);max-width:1180px;}

.ticker-wrap{overflow:hidden;background:var(--ink);color:var(--paper);padding:8px 0;display:flex;white-space:nowrap;border-bottom:3px solid var(--rule);border-top:3px solid var(--rule);margin-bottom:30px}
.ticker-in{display:inline-flex;animation:ticker 20s linear infinite;}
@keyframes ticker { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-50%, 0, 0); } }
.ticker-item{padding:0 24px;font-family:"Anton",sans-serif;font-size:24px;letter-spacing:.08em;line-height:1}

.stat-online{display:flex;align-items:center;gap:6px;font-family:"Zen Kaku Gothic New",sans-serif;font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.1em;margin-right:12px}
.stat-dot{width:8px;height:8px;background-color:#00ff00;border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
.bar-in{max-width:1180px;margin:0 auto;padding:10px 26px;display:flex;align-items:center;gap:18px}
.crest{display:flex;align-items:center;gap:11px;text-decoration:none}
.crest-mark{width:34px;height:34px;display:grid;place-items:center;background:var(--ink);color:var(--paper);
  font-family:"Anton",sans-serif;font-size:15px}
.crest-txt{font-weight:900;letter-spacing:.14em;font-size:12px;text-transform:uppercase}
nav{margin-left:auto;display:flex;gap:22px}
nav a{font-weight:700;letter-spacing:.14em;font-size:11.5px;text-transform:uppercase;text-decoration:none;
  color:var(--ink-faint);padding:3px 0;position:relative;transition:color .2s}
nav a:hover,nav a:focus-visible,nav a.active{color:var(--ink)}
nav a .underline{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--ink)}
.controls{display:flex;align-items:center;gap:8px;padding-left:16px;border-left:3px solid var(--rule)}
.tgl{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:700;letter-spacing:.14em;font-size:10.5px;
  text-transform:uppercase;background:transparent;color:var(--ink);cursor:pointer;
  border:2px solid var(--ink);padding:6px 10px;white-space:nowrap}
.tgl[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.progress{position:absolute;left:0;bottom:-3px;height:3px;width:100%;background:var(--ink)}

/* ══ hero ═══════════════════════════════════════════════════════════════ */
.hero{position:relative;padding:104px 0 88px;overflow:hidden;background:none}
.kicker{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
h1{font-size:clamp(56px,11vw,150px);max-width:11ch}
h1 .ln{display:block;overflow:hidden;padding-bottom:.03em}
h1 .ln i{display:block;font-style:normal}
h1 em{font-style:normal;color:transparent;-webkit-text-stroke:2px var(--ink)}
.slash{height:10px;margin:28px 0 24px;background:repeating-linear-gradient(115deg,
  var(--ink) 0 22px, transparent 22px 34px);max-width:min(520px,72%)}
.lede{max-width:54ch;color:var(--ink-soft);font-size:17px}
.cta{display:flex;flex-wrap:wrap;gap:14px;margin-top:30px}
.btn{font-weight:700;letter-spacing:.16em;font-size:12px;text-transform:uppercase;text-decoration:none;
  padding:14px 26px;border:3px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;
  box-shadow:var(--shadow);display:inline-block}
.btn.hollow{background:transparent;color:var(--ink)}
.vitals{display:flex;flex-wrap:wrap;margin-top:60px;border:3px solid var(--rule)}
.vitals div{padding:16px 26px;border-right:3px solid var(--rule);flex:1 1 150px}
.vitals div:last-child{border-right:0}
.vitals b{display:block;font-family:"Anton",sans-serif;font-size:36px;line-height:1}
.vitals span{display:block;margin-top:4px}

/* ══ panels ═════════════════════════════════════════════════════════════ */
section{padding:92px 0;border-top:3px solid var(--rule)}
.rail{display:grid;grid-template-columns:200px minmax(0,1fr);gap:38px;align-items:start}
.rail-head{position:sticky;top:92px}
.rail-head h2{font-size:clamp(30px,3.2vw,44px);margin:8px 0 8px}
.rail-head .lbl,.rail-head .jp{display:block}

/* player card */
.card-grid{display:grid;grid-template-columns:minmax(0,330px) minmax(0,1fr);gap:38px;align-items:start}
.pcard{border:3px solid var(--rule);background:var(--paper);padding:22px;position:relative;
  box-shadow:var(--shadow)}
.pcard .toneband{position:absolute;inset:auto 0 0 0;height:120px;pointer-events:none}
.pcard-top{display:flex;gap:16px;align-items:flex-start;border-bottom:3px solid var(--rule);padding-bottom:14px}
.ovr{font-family:"Anton",sans-serif;font-size:60px;line-height:.82}
.pcard-name{font-family:"Anton",sans-serif;font-size:26px;line-height:1.02;margin-left:auto;text-align:right}
.radar-box{display:grid;place-items:center;padding:8px 0 2px}
.attrs{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;margin-top:12px;
  border-top:3px solid var(--rule);padding-top:14px}
.attr{display:flex;align-items:baseline;gap:9px}
.attr b{font-family:"Anton",sans-serif;font-size:19px;min-width:28px}
.meta{display:flex;flex-direction:column;gap:7px;margin-top:14px;border-top:3px solid var(--rule);padding-top:12px}
.meta div{display:flex;justify-content:space-between;font-size:13.5px;gap:12px}
.meta dd{margin:0;font-weight:700;text-align:right}
.bio p{color:var(--ink-soft);max-width:62ch}
.bio p:first-child{margin-top:0}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));margin-top:28px;
  border:3px solid var(--rule)}
.stat{padding:18px;border-right:3px solid var(--rule)}
.stat:last-child{border-right:0}
.stat b{display:block;font-family:"Anton",sans-serif;font-size:38px;line-height:1}
.stat span{display:block;margin-top:4px}

/* formation */
.form-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;align-items:start}
.pitch{position:relative;aspect-ratio:16/10;border:3px solid var(--rule);background:var(--paper);overflow:hidden}
.pitch .toneband{position:absolute;inset:0;pointer-events:none;opacity:calc(var(--tone-op) * .5)}
.pitch svg.mark{position:absolute;inset:0;width:100%;height:100%}
.player{position:absolute;width:clamp(46px,5vw,58px);height:clamp(46px,5vw,58px);
  border:3px solid var(--ink);cursor:pointer;padding:0;background:var(--paper);color:var(--ink);
  display:grid;place-items:center;line-height:1.02;font-family:"Anton",sans-serif;
  font-size:clamp(14px,1.6vw,18px);margin-left:calc(clamp(46px,5vw,58px) / -2);
  margin-top:calc(clamp(46px,5vw,58px) / -2)}
.player.sel{background:var(--ink);color:var(--paper)}
.player small{display:block;font-family:"Zen Kaku Gothic New",sans-serif;font-weight:700;
  font-size:8.5px;letter-spacing:.08em}
.pick{position:absolute;inset:-9px;border:3px solid var(--ink);pointer-events:none}
.passball{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--paper);
  border:3px solid var(--ink);margin-left:-6px;margin-top:-6px;pointer-events:none}
.readout{border:3px solid var(--rule);background:var(--paper);padding:22px;position:sticky;top:92px;
  box-shadow:var(--shadow);overflow:hidden}
.readout h3{font-size:28px;margin:8px 0 4px}
.readout .rate{display:flex;align-items:baseline;gap:10px;margin:14px 0 6px}
.readout .rate b{font-family:"Anton",sans-serif;font-size:44px;line-height:.9}
.readout p{color:var(--ink-soft);font-size:14.5px;margin:12px 0 0}
.track{height:10px;border:3px solid var(--ink);overflow:hidden}
.fill{height:100%;background:var(--ink);transform-origin:0% 50%}
.bench{margin-top:18px;border-top:3px solid var(--rule);padding-top:14px}
.bench .lbl{display:block;margin-bottom:9px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:700;letter-spacing:.1em;font-size:10.5px;
  text-transform:uppercase;padding:6px 10px;border:2px solid var(--ink);color:var(--ink);
  background:transparent;cursor:pointer}
.chip.sel{background:var(--ink);color:var(--paper)}

/* goals */
.goals{display:grid;gap:22px}
.goal{border:3px solid var(--rule);background:var(--paper);padding:28px;position:relative;
  display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:32px;box-shadow:var(--shadow)}
.goal h3{font-size:clamp(25px,2.6vw,34px);margin:8px 0 12px}
.goal p{color:var(--ink-soft);font-size:15px;margin:0;max-width:62ch}
.goal ul{color:var(--ink-soft);font-size:15px;margin:10px 0 0;padding-left:18px;max-width:62ch}
.goal li{margin-bottom:4px}
.headline-stat{border-left:3px solid var(--rule);padding-left:24px}
.headline-stat b{display:block;font-family:"Anton",sans-serif;font-size:clamp(38px,4.6vw,56px);line-height:.9}
.headline-stat .more{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.headline-stat .more div{display:flex;justify-content:space-between;gap:10px;font-size:13px;
  border-top:2px solid var(--rule);padding-top:7px}
.tech{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tech i{font-style:normal;font-weight:700;letter-spacing:.1em;font-size:10.5px;text-transform:uppercase;
  padding:4px 9px;border:2px solid var(--ink);color:var(--ink)}

/* log */
.log{position:relative;padding-left:32px}
.log .spine{position:absolute;left:5px;top:10px;bottom:10px;width:3px;background:var(--rule);
  transform-origin:50% 0%}
.leg{position:relative;padding:0 0 38px}
.leg:last-child{padding-bottom:0}
.leg .pip{position:absolute;left:-32px;top:8px;width:13px;height:13px;background:var(--ink)}
.leg h3{font-size:26px;margin:8px 0 2px}
.leg .where{color:var(--ink-soft);font-weight:700;margin-bottom:6px}
.leg ul{margin:8px 0 0;padding-left:18px;color:var(--ink-soft)}
.leg li{margin-bottom:5px}

.cabinet{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));border:3px solid var(--rule)}
.trophy{padding:22px;border-right:3px solid var(--rule);position:relative;overflow:hidden}
.trophy:last-child{border-right:0}
.trophy .yr{font-family:"Anton",sans-serif;font-size:36px;line-height:1}
.trophy h3{font-size:18px;margin:10px 0 4px;line-height:1.18}
.trophy span{color:var(--ink-faint);font-size:13.5px}

footer{border-top:3px solid var(--rule);padding:92px 0 60px}
footer h2{font-size:clamp(44px,10vw,132px);margin:14px 0 22px;max-width:11ch}
.links{display:flex;gap:14px;flex-wrap:wrap;margin-top:26px}
.sig{margin-top:58px;padding-top:18px;border-top:3px solid var(--rule);display:flex;
  justify-content:space-between;gap:16px;flex-wrap:wrap}

@media (max-width:1040px){
  .rail{grid-template-columns:1fr;gap:22px}
  .rail-head{position:static}
  .form-grid{grid-template-columns:1fr}
  .readout{position:static}
  .goal{grid-template-columns:1fr;gap:20px}
  .headline-stat{border-left:0;border-top:3px solid var(--rule);padding-left:0;padding-top:16px}
  .figure{right:-10vw;height:72vh;opacity:.5}
  .cabinet{grid-template-columns:1fr}
  .trophy{border-right:0;border-bottom:3px solid var(--rule)}
  .trophy:last-child{border-bottom:0}
}
@media (max-width:820px){
  .card-grid{grid-template-columns:1fr}
  nav{display:none}
  .controls{margin-left:auto;border-left:0;padding-left:0}
  .hero{padding:64px 0 60px}
  .pitch{aspect-ratio:4/5}
  .stat{border-right:0;border-bottom:3px solid var(--rule)}
  .stat:last-child{border-bottom:0}
  .plate .fade{background:linear-gradient(180deg,color-mix(in srgb,var(--paper) 60%,transparent),var(--paper) 76%)}
}

/* ══ curvy borders ════════════════════════════════════════════════════ */
.btn, .pcard, .readout, .pitch, .goal, .trophy, .stat-row, .vitals, .chip, .tgl {
  border-radius: 16px;
}
.player, .passball {
  border-radius: 50%;
}
</style>

<div id="root"></div>

/* ── counting number, driven by a MotionValue ────────────────────────── */
function Count({ to, suffix = "", dec = 0 }) {
  const mv = useMotionValue(0);
  const text = useTransform(mv, v => v.toFixed(dec) + suffix);
  const ref = useRef(null);
  const seen = useInView(ref, { once: true, amount: .5 });
  useEffect(() => {
    if (seen) { const c = animate(mv, to, { duration: 1.1, ease: EASE }); return () => c.stop(); }
  }, [seen, to]);
  return <motion.span ref={ref} className="num">{text}</motion.span>;
}

/* ── section rail ────────────────────────────────────────────────────── */
function Rail({ id, index, title, jp, children }) {
  return (
    <section id={id}>
      <div className="wrap">
        <div className="rail">
          <motion.div className="rail-head" variants={riseIn} {...inViewProps}>
            <span className="lbl">{index}</span>
            <h2>{title}</h2>
            <span className="jp">{jp}</span>
          </motion.div>
          <div>{children}</div>
        </div>
      </div>
    </section>
  );
}

function Reel({ running, parallax }) {
  const vid = useRef(null);
  useEffect(() => {
    const v = vid.current; if (!v) return;
    if (running) { const p = v.play(); if (p && p.catch) p.catch(() => {}); } else { v.pause(); }
  }, [running]);
  return (
    <motion.div className="reel" style={{ y: parallax }}
      initial={{ opacity: 0, scale: 1.06 }} animate={{ opacity: 1, scale: 1 }}
      transition={{ duration: 1.6, ease: EASE }}>
      <video ref={vid} autoPlay muted loop playsInline preload="auto" src={CLIP} />
      <div className="dots" />
      <div className="press" />
      <div className="edge" />
    </motion.div>
  );
}

/* ── manga speed lines ───────────────────────────────────────────────── */
function SpeedLines({ running }) {
  const ref = useRef(null);
  const rays = useRef([]);
  const phase = useRef(0);
  useEffect(() => {
    const cv = ref.current;
    const build = () => {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      cv.width = cv.clientWidth * dpr; cv.height = cv.clientHeight * dpr;
      cv.getContext("2d").setTransform(dpr, 0, 0, dpr, 0, 0);
      rays.current = Array.from({ length: 150 }, () => ({
        a: Math.random() * 6.2832, inner: 120 + Math.random() * 340,
        len: 160 + Math.random() * 760, w: .6 + Math.random() * 2.6,
        sp: .12 + Math.random() * .5, ph: Math.random() * 6.2832
      }));
    };
    build();
    window.addEventListener("resize", build);
    return () => window.removeEventListener("resize", build);
  }, []);
  useAnimationFrame(() => {
    const cv = ref.current; if (!cv) return;
    const ctx = cv.getContext("2d");
    const W = cv.clientWidth, H = cv.clientHeight;
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--ink").trim() || "#0B0B0C";
    const fx = W * .78, fy = H * .46;
    if (running) phase.current += .006;
    rays.current.forEach(r => {
      const b = Math.sin(phase.current * r.sp * 6 + r.ph);
      const i0 = r.inner + b * 26, i1 = i0 + r.len;
      ctx.globalAlpha = .05 + Math.abs(b) * .09;
      ctx.lineWidth = r.w;
      ctx.beginPath();
      ctx.moveTo(fx + Math.cos(r.a) * i0, fy + Math.sin(r.a) * i0);
      ctx.lineTo(fx + Math.cos(r.a) * i1, fy + Math.sin(r.a) * i1);
      ctx.stroke();
    });
    ctx.globalAlpha = 1;
  });
  return <canvas id="lines" ref={ref} aria-hidden="true" />;
}

/* ── radar ───────────────────────────────────────────────────────────── */
function Radar() {
  const cx = 130, cy = 120, R = 86, n = RADAR.length;
  const at = (i, r) => {
    const a = -Math.PI / 2 + i * 2 * Math.PI / n;
    return [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
  };
  const ring = f => RADAR.map((_, i) => at(i, R * f).map(v => v.toFixed(1)).join(",")).join(" ");
  const shape = RADAR.map((v, i) => at(i, R * (v - 40) / 60).map(q => q.toFixed(1)).join(",")).join(" ");
  return (
    <svg viewBox="0 0 260 240" width="100%" height="232" role="img"
         aria-label="Attribute radar: ML and AI 88, Big Data 86, Algorithms 85, Backend 84, Systems 80, Interfaces 78">
      <g stroke="var(--ink)" strokeOpacity=".35" fill="none">
        {[0.35, 0.6, 0.85, 1].map(f => <polygon key={f} points={ring(f)} />)}
        {RADAR.map((_, i) => {
          const [x, y] = at(i, R);
          return <line key={i} x1={cx} y1={cy} x2={x.toFixed(1)} y2={y.toFixed(1)} />;
        })}
      </g>
      <motion.polygon points={shape} fill="var(--ink)" fillOpacity=".16" stroke="var(--ink)" strokeWidth="3"
        style={{ transformOrigin: "130px 120px" }}
        initial={{ scale: .05, opacity: 0 }} whileInView={{ scale: 1, opacity: 1 }}
        viewport={{ once: true, amount: .4 }}
        transition={{ type: "spring", stiffness: 90, damping: 14, delay: .15 }} />
      {RADAR_LABELS.map((l, i) => {
        const [x, y] = at(i, R + 18);
        return <text key={l} x={x.toFixed(1)} y={(y + 4).toFixed(1)} textAnchor="middle" fill="var(--ink-faint)"
                     fontFamily="Zen Kaku Gothic New, sans-serif" fontWeight="700" fontSize="10" letterSpacing="1.4">{l}</text>;
      })}
    </svg>
  );
}

/* ── formation ───────────────────────────────────────────────────────── */
function Formation({ running }) {
  const [sel, setSel] = useState(SQUAD[0]);
  const [ballIdx, setBallIdx] = useState(0);
  const ref = useRef(null);
  const seen = useInView(ref, { once: true, amount: .3 });

  useEffect(() => {
    if (!running || !seen) return;
    const id = setInterval(() => {
      setBallIdx(i => (i + 1 + Math.floor(Math.random() * 3)) % SQUAD.length);
    }, 1900);
    return () => clearInterval(id);
  }, [running, seen]);

  return (
    <div className="form-grid">
      <motion.div className="pitch" ref={ref} variants={riseIn} {...inViewProps}>
        <div className="tone toneband" />
        <svg className="mark" viewBox="0 0 800 500" preserveAspectRatio="none" aria-hidden="true">
          <g fill="none" stroke="var(--ink)" strokeWidth="3">
            <rect x="12" y="12" width="776" height="476" />
            <line x1="400" y1="12" x2="400" y2="488" />
            <circle cx="400" cy="250" r="66" />
            <rect x="12" y="140" width="88" height="220" />
            <rect x="12" y="200" width="32" height="100" />
            <rect x="700" y="140" width="88" height="220" />
            <rect x="756" y="200" width="32" height="100" />
          </g>
          <g>
            {SQUAD.map(p => {
              if (sel.deps && sel.deps.includes(p.abbr)) {
                return <motion.line key={"pass-"+p.abbr} x1={sel.x*8} y1={sel.y*5} x2={p.x*8} y2={p.y*5} stroke="var(--ink)" strokeWidth="4" strokeDasharray="8 8" initial={{pathLength: 0}} animate={{pathLength: 1}} transition={{duration: 0.6}} />;
              }
              if (p.deps && p.deps.includes(sel.abbr)) {
                return <motion.line key={"recv-"+p.abbr} x1={p.x*8} y1={p.y*5} x2={sel.x*8} y2={sel.y*5} stroke="var(--ink)" strokeWidth="4" strokeDasharray="8 8" initial={{pathLength: 0}} animate={{pathLength: 1}} transition={{duration: 0.6}} />;
              }
              return null;
            })}
          </g>
        </svg>

        {SQUAD.map((p, i) => (
          <motion.button key={p.name} className={"player" + (sel.name === p.name ? " sel" : "")}
            style={{ left: p.x + "%", top: p.y + "%" }}
            aria-label={p.name + ", rated " + p.v + ", " + p.kind}
            initial={{ opacity: 0, scale: .3 }}
            animate={seen ? { opacity: 1, scale: 1 } : {}}
            transition={{ type: "spring", stiffness: 260, damping: 18, delay: i * .05 }}
            whileHover={{ scale: 1.18 }} whileTap={{ scale: .94 }}
            onHoverStart={() => setSel(p)} onFocus={() => setSel(p)} onClick={() => setSel(p)}>
            {sel.name === p.name && <motion.span className="pick" layoutId="pick"
              transition={{ type: "spring", stiffness: 320, damping: 26 }} />}
            {p.no}<small>{p.abbr}</small>
          </motion.button>
        ))}

        <motion.div className="passball"
          animate={{ left: SQUAD[ballIdx].x + "%", top: SQUAD[ballIdx].y + "%" }}
          transition={{ type: "spring", stiffness: 90, damping: 14 }} />
      </motion.div>

      <motion.aside className="readout" variants={riseIn} {...inViewProps} aria-live="polite">
        <AnimatePresence mode="wait">
          <motion.div key={sel.name}
            initial={{ opacity: 0, y: 14 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0, y: -14 }}
            transition={{ duration: .28, ease: EASE }}>
            <span className="lbl">{sel.kind}</span>
            <h3>{sel.name}</h3>
            <div className="rate"><b className="num">{sel.v}</b><span className="lbl">Rating</span></div>
          </motion.div>
        </AnimatePresence>
        <div className="track">
          <motion.div className="fill" animate={{ scaleX: sel.v / 100 }} initial={{ scaleX: 0 }}
            style={{ width: "100%" }} transition={{ duration: .6, ease: EASE }} />
        </div>
        <AnimatePresence mode="wait">
          <motion.p key={sel.name + "-note"}
            initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }}
            transition={{ duration: .25 }}>{sel.note}</motion.p>
        </AnimatePresence>
        <div className="bench">
          <span className="lbl">On the bench</span>
          <div className="chips">
            {BENCH.map(b => (
              <motion.button key={b.name} className={"chip" + (sel.name === b.name ? " sel" : "")}
                whileHover={{ y: -3 }} whileTap={{ scale: .95 }}
                onHoverStart={() => setSel(b)} onClick={() => setSel(b)}>{b.name}</motion.button>
            ))}
          </div>
        </div>
      </motion.aside>
    </div>
  );
}

/* ── app ─────────────────────────────────────────────────────────────── */
function App() {
  const [mode, setMode] = useState(null);           // null = follow the system
