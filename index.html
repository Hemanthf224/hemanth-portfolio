<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Mudiam Hemanth Reddy — AI & Systems Engineer Portfolio. High-performance machine learning, CUDA/C++ GPU acceleration, and distributed big data pipelines.">
  <title>Mudiam Hemanth Reddy — AI & Systems Engineer</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230F172A'/><text x='50' y='68' font-family='system-ui,sans-serif' font-size='52' font-weight='800' fill='%2300E5FF' text-anchor='middle'>HR</text></svg>">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ═══════════════════════════════════════════════════════════════════════
       THEME VARIABLES & DESIGN SYSTEM (Linear / Vercel Modern Aesthetic)
       ═══════════════════════════════════════════════════════════════════════ */
    :root, :root[data-theme="obsidian"] {
      --bg: #07090E;
      --bg-surface: #0E131F;
      --bg-card: rgba(16, 22, 36, 0.65);
      --bg-card-hover: rgba(22, 31, 51, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(0, 229, 255, 0.4);
      --text-main: #F1F5F9;
      --text-muted: #94A3B8;
      --text-faint: #475569;
      --accent: #00E5FF;
      --accent-glow: rgba(0, 229, 255, 0.25);
      --accent-soft: rgba(0, 229, 255, 0.1);
      --secondary: #6366F1;
      --grid-dot: rgba(255, 255, 255, 0.04);
      --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.6);
      --badge-bg: rgba(0, 229, 255, 0.1);
      --badge-border: rgba(0, 229, 255, 0.25);
    }

    :root[data-theme="light"] {
      --bg: #F8FAFC;
      --bg-surface: #FFFFFF;
      --bg-card: rgba(255, 255, 255, 0.85);
      --bg-card-hover: #FFFFFF;
      --border: rgba(0, 0, 0, 0.08);
      --border-focus: rgba(37, 99, 235, 0.4);
      --text-main: #0F172A;
      --text-muted: #475569;
      --text-faint: #94A3B8;
      --accent: #2563EB;
      --accent-glow: rgba(37, 99, 235, 0.18);
      --accent-soft: rgba(37, 99, 235, 0.08);
      --secondary: #4F46E5;
      --grid-dot: rgba(0, 0, 0, 0.05);
      --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.08);
      --badge-bg: rgba(37, 99, 235, 0.08);
      --badge-border: rgba(37, 99, 235, 0.2);
    }

    :root[data-theme="violet"] {
      --bg: #090614;
      --bg-surface: #120D24;
      --bg-card: rgba(20, 14, 40, 0.65);
      --bg-card-hover: rgba(28, 20, 56, 0.85);
      --border: rgba(168, 85, 247, 0.15);
      --border-focus: rgba(168, 85, 247, 0.5);
      --text-main: #F3E8FF;
      --text-muted: #A8A29E;
      --text-faint: #64748B;
      --accent: #C084FC;
      --accent-glow: rgba(192, 132, 252, 0.3);
      --accent-soft: rgba(192, 132, 252, 0.12);
      --secondary: #EC4899;
      --grid-dot: rgba(192, 132, 252, 0.05);
      --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.7);
      --badge-bg: rgba(192, 132, 252, 0.1);
      --badge-border: rgba(192, 132, 252, 0.3);
    }

    :root[data-theme="terminal"] {
      --bg: #0A0A0A;
      --bg-surface: #121212;
      --bg-card: rgba(18, 18, 18, 0.75);
      --bg-card-hover: rgba(26, 26, 26, 0.95);
      --border: rgba(16, 185, 129, 0.2);
      --border-focus: rgba(16, 185, 129, 0.5);
      --text-main: #ECFDF5;
      --text-muted: #A7F3D0;
      --text-faint: #065F46;
      --accent: #10B981;
      --accent-glow: rgba(16, 185, 129, 0.3);
      --accent-soft: rgba(16, 185, 129, 0.12);
      --secondary: #059669;
      --grid-dot: rgba(16, 185, 129, 0.06);
      --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.8);
      --badge-bg: rgba(16, 185, 129, 0.1);
      --badge-border: rgba(16, 185, 129, 0.3);
    }

    /* ═══════════════════════════════════════════════════════════════════════
       BASE STYLES & RESET
       ═══════════════════════════════════════════════════════════════════════ */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.65;
      overflow-x: hidden;
      transition: background-color 0.35s ease, color 0.35s ease;
      background-image: radial-gradient(circle at 50% 0%, var(--accent-soft) 0%, transparent 60%),
                        radial-gradient(circle, var(--grid-dot) 1px, transparent 1px);
      background-size: 100% 100%, 28px 28px;
      background-position: 0 0, 0 0;
      min-height: 100vh;
    }

    code, pre, .mono {
      font-family: 'JetBrains Mono', monospace;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    ::selection {
      background: var(--accent);
      color: var(--bg);
    }

    .container {
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ═══════════════════════════════════════════════════════════════════════
       STICKY NAVIGATION BAR
       ═══════════════════════════════════════════════════════════════════════ */
    header.site-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 999;
      background: color-mix(in srgb, var(--bg) 75%, transparent);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      transition: background 0.3s, border-color 0.3s;
    }

    .nav-inner {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: -0.01em;
    }

    .brand-avatar {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--secondary));
      display: grid;
      place-items: center;
      color: #FFFFFF;
      font-weight: 800;
      font-size: 15px;
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      padding: 4px 10px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 100px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10B981;
      box-shadow: 0 0 8px #10B981;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.9); }
    }

    nav.nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .nav-link {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      transition: color 0.2s;
    }

    .nav-link:hover {
      color: var(--accent);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .btn-secondary:hover {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 18px;
      background: var(--text-main);
      color: var(--bg);
      font-size: 13.5px;
      font-weight: 700;
      border-radius: 8px;
      border: 1px solid transparent;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px var(--accent-glow);
    }

    /* ═══════════════════════════════════════════════════════════════════════
       HERO SECTION
       ═══════════════════════════════════════════════════════════════════════ */
    .hero {
      padding: 160px 0 80px;
      position: relative;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 100px;
      background: var(--badge-bg);
      border: 1px solid var(--badge-border);
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 24px;
    }

    .hero-title {
      font-size: clamp(38px, 5.2vw, 64px);
      font-weight: 800;
      line-height: 1.08;
      letter-spacing: -0.03em;
      margin-bottom: 24px;
      color: var(--text-main);
      max-width: 960px;
    }

    .hero-title .gradient-text {
      background: linear-gradient(135deg, var(--text-main) 30%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-lede {
      font-size: clamp(17px, 2vw, 20px);
      color: var(--text-muted);
      max-width: 780px;
      line-height: 1.6;
      margin-bottom: 36px;
      font-weight: 400;
    }

    .hero-cta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
      margin-bottom: 56px;
    }

    .social-pills {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .social-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px;
      border-radius: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-muted);
      transition: all 0.2s ease;
    }

    .social-pill:hover {
      color: var(--text-main);
      border-color: var(--accent);
      transform: translateY(-2px);
      background: var(--bg-card-hover);
    }

    /* ═══════════════════════════════════════════════════════════════════════
       IMPACT METRICS BENTO BAR
       ═══════════════════════════════════════════════════════════════════════ */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 96px;
    }

    .metric-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 16px;
      padding: 24px;
      position: relative;
      overflow: hidden;
      transition: all 0.25s ease;
      box-shadow: var(--shadow);
    }

    .metric-card:hover {
      border-color: var(--border-focus);
      transform: translateY(-3px);
      background: var(--bg-card-hover);
    }

    .metric-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.6;
    }

    .metric-icon {
      font-size: 20px;
      margin-bottom: 12px;
      display: inline-block;
    }

    .metric-value {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1;
      color: var(--text-main);
      margin-bottom: 6px;
      font-family: 'JetBrains Mono', monospace;
    }

    .metric-label {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .metric-sub {
      font-size: 12.5px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* ═══════════════════════════════════════════════════════════════════════
       SECTION HEADERS
       ═══════════════════════════════════════════════════════════════════════ */
    .section-head {
      margin-bottom: 40px;
    }

    .section-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
      display: block;
    }

    .section-title {
      font-size: clamp(28px, 3.6vw, 42px);
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-main);
      line-height: 1.15;
    }

    .section-desc {
      font-size: 16px;
      color: var(--text-muted);
      margin-top: 10px;
      max-width: 680px;
    }

    /* ═══════════════════════════════════════════════════════════════════════
       FEATURED PROJECTS (DEEP DIVE CARDS)
       ═══════════════════════════════════════════════════════════════════════ */
    .projects-grid {
      display: flex;
      flex-direction: column;
      gap: 32px;
      margin-bottom: 96px;
    }

    .project-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 36px;
      box-shadow: var(--shadow);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .project-card:hover {
      border-color: var(--border-focus);
      box-shadow: 0 20px 40px -15px var(--accent-glow);
    }

    .project-card-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .project-category {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 4px 10px;
      background: var(--accent-soft);
      border-radius: 6px;
      border: 1px solid var(--badge-border);
    }

    .project-title {
      font-size: clamp(24px, 2.5vw, 32px);
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-main);
      margin-bottom: 12px;
    }

    .project-lead {
      font-size: 16.5px;
      color: var(--text-muted);
      line-height: 1.6;
      max-width: 820px;
      margin-bottom: 24px;
    }

    .project-specs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      padding: 20px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 24px;
    }

    .spec-block strong {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--text-faint);
      text-transform: uppercase;
      display: block;
      margin-bottom: 6px;
    }

    .spec-block p {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .project-stats-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
    }

    .stat-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: color-mix(in srgb, var(--accent) 8%, transparent);
      border: 1px solid var(--badge-border);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
    }

    .stat-badge b {
      color: var(--accent);
      font-family: 'JetBrains Mono', monospace;
    }

    .tech-stack-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .tech-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-muted);
    }

    .project-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 24px;
    }

    /* ═══════════════════════════════════════════════════════════════════════
       INTERACTIVE SYSTEM ARCHITECTURE & SKILLS GRID
       ═══════════════════════════════════════════════════════════════════════ */
    .skills-section {
      margin-bottom: 96px;
    }

    .skills-filter {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 28px;
    }

    .filter-btn {
      padding: 8px 16px;
      border-radius: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-btn.active, .filter-btn:hover {
      background: var(--text-main);
      color: var(--bg);
      border-color: var(--text-main);
    }

    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 18px;
    }

    .skill-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 14px;
      padding: 22px;
      transition: all 0.2s ease;
    }

    .skill-card:hover {
      border-color: var(--border-focus);
      transform: translateY(-2px);
      background: var(--bg-card-hover);
    }

    .skill-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .skill-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
    }

    .skill-level {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      padding: 2px 8px;
      background: var(--accent-soft);
      border-radius: 4px;
    }

    .skill-bar-wrap {
      height: 6px;
      background: var(--bg-surface);
      border-radius: 100px;
      overflow: hidden;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }

    .skill-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--secondary), var(--accent));
      border-radius: 100px;
    }

    .skill-note {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* ═══════════════════════════════════════════════════════════════════════
       INTERACTIVE DEVELOPER TERMINAL / API SANDBOX
       ═══════════════════════════════════════════════════════════════════════ */
    .terminal-section {
      margin-bottom: 96px;
    }

    .terminal-window {
      background: #0B0E14;
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .terminal-header {
      height: 44px;
      background: #10141D;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .terminal-dots {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .terminal-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
    }

    .dot-red { background: #EF4444; }
    .dot-yellow { background: #F59E0B; }
    .dot-green { background: #10B981; }

    .terminal-tabs {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-left: 12px;
    }

    .term-tab {
      padding: 4px 12px;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      color: #94A3B8;
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    .term-tab.active {
      color: #F8FAFC;
      background: #1B2232;
    }

    .terminal-body {
      padding: 24px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13.5px;
      line-height: 1.7;
      color: #E2E8F0;
      overflow-x: auto;
      min-height: 220px;
    }

    .term-prompt {
      color: #10B981;
    }

    .term-cmd {
      color: #00E5FF;
      font-weight: 600;
    }

    .term-comment {
      color: #64748B;
    }

    .term-json-key { color: #818CF8; }
    .term-json-str { color: #34D399; }
    .term-json-num { color: #F59E0B; }

    /* ═══════════════════════════════════════════════════════════════════════
       CAREER & EDUCATION JOURNEY
       ═══════════════════════════════════════════════════════════════════════ */
    .timeline-section {
      margin-bottom: 96px;
    }

    .timeline-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 28px;
    }

      const seen = useInView(ref, { once: true, amount: 0.5 });

        if (seen) {
          const c = animate(mv, to, { duration: 1.2, ease: [0.16, 1, 0.3, 1] });

        }
      }, [seen, to]);
